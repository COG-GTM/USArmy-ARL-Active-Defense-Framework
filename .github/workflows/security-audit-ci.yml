name: security-audit-ci

on:
  push:
    branches:
      - main
      - 'devin/**'
  pull_request:
    branches:
      - main

jobs:
  compliance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest IPy dpkt
      - name: Run security-audit + compliance test suite
        run: |
          pytest tests/ -v --tb=short

  c-static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck + libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck libpcap-dev
      - name: cppcheck (bpf_tap.c)
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --suppress=variableScope \
            --quiet \
            src/bpf_tap.c
      - name: Compile bpf_tap.c with -Wall -Wextra
        run: |
          gcc -c -Wall -Wextra src/bpf_tap.c -o /tmp/bpf_tap.o
